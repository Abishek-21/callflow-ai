# Run the whole app with:  docker compose up --build
#   UI:       http://localhost:8501
#   API docs: http://localhost:8000/docs
#
# Works without an API key (mock evaluation). For AI evaluation, put
# OPENAI_API_KEY (and optionally OPENAI_BASE_URL / OPENAI_MODEL) in .env.

services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/callflow.db
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - callflow-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    command:
      ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  callflow-data:
